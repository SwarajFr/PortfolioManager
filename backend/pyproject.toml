[project]
name = "portfolio-optimizer-backend"
version = "0.1.0"
description = "FastAPI backend for the portfolio analytics dashboard (Zerodha Kite Connect)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "kiteconnect>=5.2.0",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "uvicorn>=0.49.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# Run from backend/; put the project root on sys.path so `features...` imports resolve.
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
